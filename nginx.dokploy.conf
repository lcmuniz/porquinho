events {
    worker_connections 1024;
}

http {
    # Dokploy: o Traefik termina o TLS e entrega aqui em HTTP; o esquema real chega em X-Forwarded-Proto
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # Headers de segurança (herdados pelas locations, que não definem add_header próprio)
        server_tokens off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # shortcut: CSP só em Report-Only até ser validada no navegador em produção; depois trocar para Content-Security-Policy
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.supabase.co" always;

        # API routes -> backend
        location /api/ {
            # Story 5.1: upload de extrato de até 10MB (o padrão do nginx é 1MB)
            client_max_body_size 11m;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }

        # Actuator - restrict to internal/monitoring only
        location /actuator/ {
            deny all;
            return 403;
        }

        # Everything else -> frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
        }
    }
}
